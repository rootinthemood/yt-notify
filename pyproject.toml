readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altgraph>=0.17.5",
    "certifi>=2026.10.23",
    "charset-normalizer>=3.5.2",
    "idna>=3.20",
    "pyperclip>=1.11.0",
    "pyqt6>=6.11.0",
    "pyqt6-qt6>=6.11.2",
    "pyqt6-sip>=13.13.0",
    "pyqtdarktheme>=2.1.0",
    "requests>=2.34.2",
    "typing-extensions>=4.16.0",
    "urllib3>=2.8.0",
]
